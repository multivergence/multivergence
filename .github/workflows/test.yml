name: test

# Every push to main and every pull request: formatting, vet, the full test
# suite (isolation against a full-copy model, SIGKILL during promotes and
# compactions, replay, the 30-day schedule, cost, many processes on one
# file, Python driving the command) on Linux, macOS and Windows, the race
# detector on Linux, the release plan's cases, and the smoke check on static
# release-style binaries. A passing run on main starts the release workflow,
# which releases a raised version.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x"]
        include:
          # The oldest Go that go.mod allows.
          - os: ubuntu-latest
            go: "1.24.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - if: runner.os == 'Linux' && matrix.go == '1.26.x'
        run: go test -race -count=1 ./...
      - name: Release plan cases
        shell: bash
        run: |
          PY=python3; if [ "$RUNNER_OS" = "Windows" ]; then PY=python; fi
          "$PY" -B -m unittest discover -s scripts -p '*_test.py'
      - name: Smoke check on release-style binaries
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir bin
          go build -trimpath -ldflags '-s -w' -o "bin/multivergence$ext" ./cmd/multivergence
          go build -trimpath -ldflags '-s -w' -o "bin/multivergence-demo$ext" ./examples/agent
          PY=python3; if [ "$RUNNER_OS" = "Windows" ]; then PY=python; fi
          "$PY" scripts/smoke.py bin
